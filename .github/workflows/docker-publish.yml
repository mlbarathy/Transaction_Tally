name: Build & Push PySpark Image

on:
  push:
    branches:
      - DEV_1

env:
  REGISTRY: ghcr.io

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU
        id: qemu
        uses: docker/setup-qemu-action@v3.6.0

      - name: Set up Docker Buildx
        id: buildx
        uses: docker/setup-buildx-action@v3.11.1

      - name: Login to GHCR
        if: env.REGISTRY == 'ghcr.io'
        uses: docker/login-action@v3.5.0
        with:
          registry: ghcr.io
          username: ${{ vars.GH_REGISTRY_USERNAME }}
          password: ${{ secrets.GH_REGISTRY_PAT }}

      - name: Build and Push
        id: docker_build
        uses: docker/build-push-action@v6.18.0
        env:
          REPO_NAME: ${{ vars.GH_CONTAINER_REPO }}
        with:
          platforms: linux/amd64
          context: .
          push: true
          build-args: |
            POSTGRES_USER=${{ env.POSTGRES_USER }}
            POSTGRES_PASSWORD=${{ env.POSTGRES_PASSWORD }}
            POSTGRES_DB=${{ env.POSTGRES_DB }}
            POSTGRES_HOST=${{ env.POSTGRES_HOST }}
            POSTGRES_PORT=${{ env.POSTGRES_PORT }}
            POSTGRES_TABLE=${{ env.POSTGRES_TABLE }}
            POSTGRES_HISTORY_TABLE=${{ env.POSTGRES_HISTORY_TABLE }}
            POSTGRESS_TABLE_PKID=${{ env.POSTGRESS_TABLE_PKID }}
            POSTGRES_DRIVER=${{ env.POSTGRES_DRIVER }}
            POSTGRES_URL=${{ env.POSTGRES_URL }}
            TARGET_DB=${{ env.TARGET_DB }}
            KAFKA_BOOTSTRAP_SERVERS=${{ env.KAFKA_BOOTSTRAP_SERVERS }}
            KAFKA_TOPIC=${{ env.KAFKA_TOPIC }}
            CHECKPOINT_LOC=${{ env.CHECKPOINT_LOC }}
          tags: ${{ env.REGISTRY }}/${{ vars.GH_REGISTRY_USERNAME }}/${{ env.REPO_NAME }}/${{ vars.DOCKER_IMAGE_NAME }}:latest